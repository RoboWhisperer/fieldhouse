name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do on game night?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: sport
    attributes:
      label: Sport
      options: [Basketball, Football, Volleyball, Soccer, Baseball or softball, Other, Not sport-specific]
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test it on real equipment
        - label: I can write code or docs for it
